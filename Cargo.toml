[package]
name = "nasty-top"
version = "0.0.11"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "A top-like TUI for bcachefs filesystems"
repository = "https://github.com/nasty-project/nasty-top"
homepage = "https://github.com/nasty-project/nasty-top"
readme = "README.md"
keywords = ["bcachefs", "filesystem", "monitoring", "tui"]
categories = ["command-line-utilities", "filesystem"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "TUNING_RULES.md"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
nix = { version = "0.31", features = ["fs"] }
